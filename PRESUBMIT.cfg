[Hook Scripts]
cros format = cros format --check --commit ${PRESUBMIT_COMMIT} --exclude */templates/* --exclude rust/alchemy_crates/crates/* ${PRESUBMIT_FILES}
cros lint = cros lint --commit ${PRESUBMIT_COMMIT} ${PRESUBMIT_FILES}

[Hook Overrides]
cros_license_check: true

[Hook Overrides Options]
cros_license_check: --exclude_regex=^rust/alchemy_crates/crates/
